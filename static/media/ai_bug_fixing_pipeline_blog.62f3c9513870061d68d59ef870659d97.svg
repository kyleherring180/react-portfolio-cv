<svg width="345" height="194" viewBox="0 0 345 194" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a5775" />
      <stop offset="100%" stop-color="#123e52" />
    </linearGradient>
  </defs>

  <rect width="345" height="194" fill="url(#bg)" />

  <text x="172.5" y="26" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">
    Bug-Fixing Pipeline
  </text>

  <!-- robot agent character -->
  <g transform="translate(172.5, 100)">
    <!-- antenna -->
    <line x1="0" y1="-52" x2="0" y2="-40" stroke="#8fd6ff" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-56" r="5" fill="#cf6a3f" />

    <!-- head -->
    <rect x="-32" y="-40" width="64" height="46" rx="14" fill="#ffffff" opacity="0.95" />
    <!-- face screen -->
    <rect x="-24" y="-30" width="48" height="26" rx="8" fill="#123e52" />
    <!-- eyes -->
    <circle cx="-10" cy="-17" r="4" fill="#8fd6ff" />
    <circle cx="10" cy="-17" r="4" fill="#8fd6ff" />

    <!-- body -->
    <rect x="-40" y="8" width="80" height="46" rx="12" fill="#ffffff" opacity="0.95" />
    <!-- chest badge -->
    <circle cx="0" cy="31" r="13" fill="#cf6a3f" />
    <text x="0" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">C</text>

    <!-- arms -->
    <rect x="-54" y="14" width="12" height="30" rx="6" fill="#ffffff" opacity="0.95" />
    <rect x="42" y="14" width="12" height="30" rx="6" fill="#ffffff" opacity="0.95" />
  </g>

  <text x="172.5" y="172" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">
    Claude
  </text>
  <text x="172.5" y="186" text-anchor="middle" fill="#8fd6ff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-style="italic">
    autonomous AI agent
  </text>
</svg>
